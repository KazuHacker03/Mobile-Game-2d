<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOBA MUGEN - Main Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-screen">

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="player-info">
        <div class="avatar">
          <img src="" alt="" onerror="this.style.display='none'">
          <span class="avatar-fallback">P</span>
        </div>
        <div class="player-meta">
          <div class="player-name">PlayerOne</div>
          <div class="player-level">Lv. 25 &bull; Warrior III</div>
        </div>
      </div>

      <div class="currencies">
        <div class="currency gold"><span class="icon">&#9733;</span><span id="gold">12,450</span><button class="plus">+</button></div>
        <div class="currency gem"><span class="icon">&#9670;</span><span id="gems">860</span><button class="plus">+</button></div>
      </div>

      <div class="top-icons">
        <button class="icon-btn" title="Mail">&#9993;</button>
        <button class="icon-btn" title="Settings">&#9881;</button>
      </div>
    </header>

    <!-- LEFT MENU -->
    <aside class="side-menu">
      <button class="side-btn active" data-tab="battle">
        <span class="side-icon">&#9876;</span><span>Battle</span>
      </button>
      <button class="side-btn" data-tab="heroes">
        <span class="side-icon">&#9819;</span><span>Heroes</span>
      </button>
      <button class="side-btn" data-tab="shop">
        <span class="side-icon">&#9830;</span><span>Shop</span>
      </button>
      <button class="side-btn" data-tab="event">
        <span class="side-icon">&#9889;</span><span>Event</span>
      </button>
      <button class="side-btn" data-tab="social">
        <span class="side-icon">&#9742;</span><span>Social</span>
      </button>
    </aside>

    <!-- CENTER STAGE -->
    <main class="stage">
      <div class="hero-showcase">
        <div class="hero-glow"></div>
        <div class="hero-silhouette">
          <div class="hero-head"></div>
          <div class="hero-body"></div>
          <div class="hero-cape"></div>
        </div>
        <div class="hero-info">
          <span class="hero-role">WARRIOR</span>
          <h2 class="hero-name">Kaelith the Ember</h2>
          <div class="hero-stars">&#9733; &#9733; &#9733; &#9733; &#9734;</div>
        </div>
      </div>

      <div class="news-banner">
        <span class="news-tag">NEW</span>
        <span>Season 8 is live! Claim your free hero skin.</span>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">
      <div class="panel-card">
        <h3>Daily Mission</h3>
        <div class="mission">
          <span>Win 3 matches</span>
          <div class="progress"><div class="progress-fill" style="width: 66%"></div></div>
          <small>2 / 3</small>
        </div>
        <div class="mission">
          <span>Get 10 kills</span>
          <div class="progress"><div class="progress-fill" style="width: 40%"></div></div>
          <small>4 / 10</small>
        </div>
      </div>

      <div class="panel-card">
        <h3>Rank</h3>
        <div class="rank-row">
          <div class="rank-badge">&#9733;</div>
          <div>
            <div class="rank-name">Epic III</div>
            <div class="rank-points">1,240 pts</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- BOTTOM BAR -->
    <footer class="bottom-bar">
      <button class="bottom-btn">Team</button>
      <button class="bottom-btn">Mode</button>
      <button class="play-btn" id="playBtn">
        <span>PLAY</span>
      </button>
      <button class="bottom-btn">Tasks</button>
      <button class="bottom-btn">Chat</button>
    </footer>

    <!-- MODE SELECT MODAL -->
    <div class="modal" id="modal" hidden>
      <div class="modal-box">
        <h3>Select Mode</h3>
        <button class="mode-btn">Classic 5v5</button>
        <button class="mode-btn">Ranked</button>
        <button class="mode-btn">Brawl</button>
        <button class="close-btn" id="closeModal">Cancel</button>
      </div>
    </div>

  </div>

  <script>
    // Side menu tab switching
    document.querySelectorAll('.side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Play button opens mode select
    const modal = document.getElementById('modal');
    document.getElementById('playBtn').addEventListener('click', () => modal.hidden = false);
    document.getElementById('closeModal').addEventListener('click', () => modal.hidden = true);
    modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
  </script>
</body>
</html>
